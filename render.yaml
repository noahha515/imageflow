# Render Blueprint: New → Blueprint → select this repo.
# Render appended a suffix to the API hostname (imageflow-api was taken).
# If hostnames change, update CORS_ORIGINS and VITE_API_BASE_URL.
services:
  - type: web
    name: imageflow-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGINS
        value: https://imageflow-web.onrender.com
      # Requests arrive via a Cloudflare edge, then Render's internal proxy. Trust up to
      # 3 hops, each private or in Cloudflare's published ranges (cloudflare.com/ips).
      - key: TRUST_PROXY
        value: '3'
      - key: TRUSTED_PROXY_CIDRS
        value: '173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32'
      # Free instances have 512 MB RAM.
      - key: MAX_CONCURRENT_JOBS
        value: '4'
      - key: CACHE_MAX_BYTES
        value: '52428800'

  - type: web
    name: imageflow-web
    runtime: static
    buildCommand: npm ci && npm run build -w apps/web
    staticPublishPath: ./apps/web/dist
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: VITE_API_BASE_URL
        value: https://imageflow-api-u92h.onrender.com
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
